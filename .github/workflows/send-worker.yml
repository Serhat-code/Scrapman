name: Worker d'envoi (send_worker)

# Remplace l'exécution manuelle/cron locale du worker : GitHub Actions fait
# tourner send_worker.py gratuitement (minutes Actions incluses), sans
# nécessiter de serveur permanent. Le frontend (Vercel, serverless) ne peut
# pas exécuter de Python lui-même — c'est ce qui rend ce workflow
# indispensable maintenant que l'app est déployée. Déclenché soit par le
# planning (toutes les 15 min), soit à la demande par le bouton « Envoyer
# maintenant » du frontend (workflow_dispatch).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximum d'envois pour ce passage"
        required: false
        default: "15"
      user_id:
        description: "UUID utilisateur déclencheur (optionnel — sinon toutes les équipes)"
        required: false
        default: ""
      team_id:
        description: "UUID de l'équipe dont le verrou doit être libéré en fin de run (déclenchement manuel uniquement)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    # Doit rester nettement au-dessus de WORKER_MAX_RUNTIME_SECONDS (25 min) :
    # le worker s'arrête de lui-même avant, ce timeout n'est plus qu'un
    # garde-fou. Avant, 12 minutes contre une demande de 100 envois espacés de
    # 30-60 s : le job était systématiquement tué vers le 15e email.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_ENCRYPTION_KEY: ${{ secrets.SMTP_ENCRYPTION_KEY }}
      VILLE_PROSPECTEUR: "Saint-Étienne"
      CALENDLY_URL: "calendly.com/atlamazstudio/30min"
      SEND_LIMIT: ${{ github.event.inputs.limit || '15' }}
      WORKER_USER_ID: ${{ github.event.inputs.user_id }}
      # Budget que le worker s'impose. En sortir proprement vaut mieux que se
      # faire tuer par le runner : les verrous sont relâchés et la file reprise
      # au passage suivant.
      WORKER_MAX_RUNTIME_SECONDS: "1500"
      # Sans elle, le pixel de suivi d'ouverture pointerait vers le domaine
      # codé en dur dans config.py.
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Installer les dépendances (sans les navigateurs Playwright — inutiles pour l'envoi)
        run: pip install -r requirements.txt

      - name: Lancer le worker d'envoi
        run: |
          if [ -n "$WORKER_USER_ID" ]; then
            python send_worker.py --limit "$SEND_LIMIT" --user-id "$WORKER_USER_ID"
          else
            python send_worker.py --limit "$SEND_LIMIT"
          fi

      # Filet de securite : le worker libere deja le verrou lui-meme en fin de
      # run (_liberer_verrou_equipe). Cette etape ne sert que si le job a ete
      # tue avant d'y arriver - d'ou le `always()`.
      #
      # Le code HTTP est verifie explicitement : `curl -s` sans `-f` renvoie 0
      # meme sur un 401 ou un 404, ce qui faisait passer cette etape pour
      # `success` alors que le verrou restait pose et bloquait l'utilisateur
      # pendant 10 minutes.
      - name: Liberer le verrou de l'equipe (filet de securite)
        if: always() && github.event.inputs.team_id != ''
        env:
          TEAM_ID: ${{ github.event.inputs.team_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X PATCH "${SUPABASE_URL%/}/rest/v1/teams?id=eq.$TEAM_ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"worker_lock_at": null}')
          echo "PATCH teams -> HTTP $code"
          case "$code" in
            2*) ;;
            *) echo "::error::Liberation du verrou echouee (HTTP $code)"; exit 1 ;;
          esac
